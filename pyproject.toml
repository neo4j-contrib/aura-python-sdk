[build-system]
requires = ["hatchling>=1.25", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "aura-python-sdk"
dynamic = ["version"]
description = "Python client library for the Neo4j Aura API (v1)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Jonathan Giffard" }]
keywords = ["neo4j", "aura", "api", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1", "truststore>=0.10"]

[project.urls]
Homepage = "https://github.com/neo4j-contrib/aura-python-sdk"
"Aura API documentation" = "https://neo4j.com/docs/aura/api/overview/"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "pytest-cov>=5",
    "pyyaml>=6.0.3",
    "ruff>=0.6",
    "types-pyyaml>=6.0.12.20260906",
]

# The version comes from the latest git tag (vX.Y.Z); there is no version to edit by hand.
[tool.hatch.version]
source = "vcs"
# Used when building without git history, e.g. from a source zip.
fallback-version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/aura_python_sdk/_version.py"

[tool.uv]
# Rebuild the local install when the commit or tags change, so __version__ stays current.
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.hatch.build.targets.wheel]
packages = ["src/aura_python_sdk"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "S", "PT", "RET", "TID"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--import-mode=importlib", "-m", "not integration"]
markers = ["integration: talks to a real Aura account; needs AURA_CLIENT_ID / AURA_CLIENT_SECRET"]

[tool.coverage.run]
source = ["aura_python_sdk"]
branch = true
